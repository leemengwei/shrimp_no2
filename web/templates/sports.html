<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sportshistory价格面板</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div>
        <h1>sportshistory价格面板</h1>
        <p class="subtitle">sports_history 可视化与筛选</p>
        <div class="nav-links">
          <a class="nav-link" href="/">用户数据</a>
          <a class="nav-link active" href="/sports">sportshistory</a>
        </div>
      </div>
      <div class="user-controls">
        <label>
          Market 搜索
          <input id="marketQuery" type="text" placeholder="输入关键字过滤事件" />
        </label>
        <label>
          事件
          <select id="marketSelect"></select>
        </label>
        <label>
          Token
          <select id="tokenSelect"></select>
        </label>
      </div>
    </header>

    <section class="filters">
      <label>
        起始时间
        <input id="fromTsInput" type="text" placeholder="2026-03-01 或 Unix 秒" />
      </label>
      <label>
        结束时间
        <input id="toTsInput" type="text" placeholder="2026-03-03 或 Unix 秒" />
      </label>
      <label>
        排序
        <select id="sortSelect">
          <option value="asc" selected>时间正序</option>
          <option value="desc">时间倒序</option>
        </select>
      </label>
      <label>
        每页
        <select id="limitSelect">
          <option value="200">200</option>
          <option value="500" selected>500</option>
          <option value="1000">1000</option>
          <option value="2000">2000</option>
          <option value="5000">5000</option>
        </select>
      </label>
      <label class="inline-label">
        <input id="rawToggle" type="checkbox" />
        输出 raw
      </label>
      <button id="loadBtn">加载点位</button>
      <button id="resetBtn" class="ghost">重置</button>
    </section>

    <section class="summary" id="summaryBox">
      <div class="summary-item">
        <div class="label">事件数</div>
        <div class="value" id="marketCount">-</div>
      </div>
      <div class="summary-item">
        <div class="label">价格点数</div>
        <div class="value" id="pointsCount">-</div>
      </div>
      <div class="summary-item">
        <div class="label">时间范围</div>
        <div class="value" id="rangeInfo">-</div>
      </div>
      <div class="summary-item">
        <div class="label">Market</div>
        <div class="value" id="marketInfo">-</div>
      </div>
      <div class="summary-item">
        <div class="label">Token</div>
        <div class="value" id="tokenInfo">-</div>
      </div>
      <div class="summary-item">
        <div class="label">Fidelity</div>
        <div class="value" id="fidelityInfo">-</div>
      </div>
    </section>

    <section class="chart-section">
      <div class="chart-card">
        <div class="chart-title">价格走势</div>
        <canvas id="priceChart" width="1000" height="240"></canvas>
      </div>
    </section>

    <section class="table-section">
      <div class="table-actions">
        <div class="pager">
          <button id="prevBtn" class="ghost">上一页</button>
          <button id="nextBtn" class="ghost">下一页</button>
        </div>
        <div class="page-info">
          <span id="pageInfo">-</span>
        </div>
      </div>
      <div class="table-wrap">
        <table id="dataTable">
          <thead>
            <tr>
              <th>#</th>
              <th>时间</th>
              <th>价格</th>
              <th>Raw</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="/static/sports.js"></script>
</body>
</html>
